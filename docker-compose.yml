name: hackathon-api

services:
  php-mcp:
    image: webdevops/php-nginx:8.4
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./api:/app
    ports:
      - "8080:80"
    environment:
      FINTECH_API_BASE_URL: ${FINTECH_API_BASE_URL:-}
    networks:
      - default

networks:
  default:
    driver: bridge
